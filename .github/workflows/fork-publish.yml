name: Fork Publish
# Publishes container images from this fork to its own GHCR namespace. The
# upstream build.yml publish job is hard-guarded on `github.repository ==
# 'qdm12/ddns-updater'`, so keeping the fork publisher as a separate workflow
# means we never have to edit (and re-merge) the upstream-tracked file.
#
# Triggers:
#   - push to v2.9 branch        -> tagged with the branch name + commit
#   - workitem/* branches        -> short-lived dev builds (branch name tag)
#   - any v*-* tag push          -> the fork's semver tags, e.g. v2.9.0-1.0.0
#   - manual workflow_dispatch
#
# Image: ghcr.io/<owner>/ddns-updater
on:
  push:
    branches:
      - v2.9
      - workitem/**
    tags:
      - 'v*-*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.repository_owner != 'qdm12'
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/ddns-updater
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value={{branch}}-{{sha}},enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short commit
        id: shortcommit
        run: echo "value=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          # Match the architectures we actually deploy to today (the homelab
          # k3s cluster is amd64 + arm64). Adding more later is a one-line
          # change; building all eight upstream platforms triples CI time and
          # GHCR storage for no benefit.
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            COMMIT=${{ steps.shortcommit.outputs.value }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
